  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f9ff"/><stop offset="0.5" stop-color="#eaf2ff"/><stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <style>.lab{font:700 18px -apple-system,Segoe UI,sans-serif;fill:#1f6feb;letter-spacing:.26em}</style>
  </defs>
  <rect width="1600" height="120" fill="url(#rs-bg)"/>
