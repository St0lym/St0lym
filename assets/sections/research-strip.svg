<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="120" viewBox="0 0 1600 120" role="img" aria-label="Research and frontier">
  <defs>
    <linearGradient id="rs-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f9ff"/><stop offset="0.5" stop-color="#eaf2ff"/><stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>
    <linearGradient id="rs-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"/><stop offset="0.5" stop-color="#101d36"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <style>
      .bg{fill:url(#rs-light)} .lab{font:700 18px -apple-system,Segoe UI,sans-serif;fill:#1f6feb;letter-spacing:.26em}
      .orb{stroke:#bcd6ff} .ln{stroke:#cfe3ff} .dot{fill:#1f6feb}
      @media (prefers-color-scheme: dark){
        .bg{fill:url(#rs-dark)} .lab{fill:#6aa6ff} .orb{stroke:#2b486f} .ln{stroke:#27406b} .dot{fill:#6aa6ff}
      }
    </style>
  </defs>
  <rect class="bg" width="1600" height="120"/>
  <g class="orb" stroke-width="1" opacity="0.75" fill="none">
    <ellipse cx="200" cy="60" rx="90" ry="28"/><ellipse cx="200" cy="60" rx="90" ry="28" transform="rotate(60 200 60)"/>
    <ellipse cx="1400" cy="60" rx="90" ry="28"/><ellipse cx="1400" cy="60" rx="90" ry="28" transform="rotate(-60 1400 60)"/>
  </g>
  <g class="dot">
    <circle cx="200" cy="60" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="60" r="5"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <line class="ln" x1="430" y1="60" x2="640" y2="60" stroke-width="1.4"/>
  <line class="ln" x1="960" y1="60" x2="1170" y2="60" stroke-width="1.4"/>
  <text x="800" y="67" text-anchor="middle" class="lab">RESEARCH &amp; FRONTIER</text>
</svg>
