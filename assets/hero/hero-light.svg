<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="St0lym — Jacques Marques, Node. AI Systems Architect, Researcher, Founder of Stakon. Designing systems that create impact.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1f7ff"/>
      <stop offset="1" stop-color="#e3eeff"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="30%" r="46%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#dcebff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dcebff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6ff" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#bcd6ff" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .name{font:800 92px -apple-system,Segoe UI,Inter,sans-serif;fill:#0d1b2e;letter-spacing:-1px}
      .sub{font:600 26px -apple-system,Segoe UI,Inter,sans-serif;fill:#2a3645}
      .accent{fill:#1f6feb}
      .role{font:600 19px -apple-system,Segoe UI,sans-serif;fill:#41506180;letter-spacing:.02em}
      .tag{font:500 italic 22px Georgia,serif;fill:#3a4658}
      .jp{font:600 15px -apple-system,Segoe UI,sans-serif;fill:#9db4d6;letter-spacing:.3em}
    </style>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <!-- soft orbital rings, right side -->
  <g stroke="#bcd6ff" fill="none" opacity="0.6">
    <ellipse cx="1180" cy="210" rx="300" ry="120" transform="rotate(-18 1180 210)" stroke-width="1.2"/>
    <ellipse cx="1180" cy="210" rx="210" ry="84"  transform="rotate(-18 1180 210)" stroke-width="1" stroke-dasharray="2 7"/>
    <circle cx="1180" cy="210" r="120" stroke="#cfe3ff" stroke-width="1"/>
  </g>
  <circle cx="1372" cy="150" r="4" fill="#38bdf8"/>
  <circle cx="980"  cy="262" r="3" fill="#1f6feb"/>
  <circle cx="1280" cy="318" r="3" fill="#9db4d6"/>

  <!-- skyline silhouette -->
  <g fill="url(#fade)">
    <rect x="900"  y="360" width="34" height="160"/>
    <rect x="940"  y="300" width="40" height="220"/>
    <rect x="986"  y="340" width="26" height="180"/>
    <rect x="1018" y="250" width="46" height="270"/>
    <rect x="1070" y="330" width="30" height="190"/>
    <rect x="1106" y="220" width="52" height="300"/>
    <rect x="1164" y="300" width="34" height="220"/>
    <rect x="1204" y="180" width="58" height="340"/>
    <rect x="1268" y="290" width="30" height="230"/>
    <rect x="1304" y="250" width="44" height="270"/>
    <rect x="1354" y="320" width="28" height="200"/>
    <rect x="1388" y="270" width="50" height="250"/>
    <rect x="1444" y="340" width="32" height="180"/>
    <rect x="1482" y="240" width="48" height="280"/>
    <rect x="1536" y="300" width="34" height="220"/>
  </g>

  <!-- node mark -->
  <g transform="translate(96,70)">
    <path d="M30 0 L60 17 L60 51 L30 68 L0 51 L0 17 Z" fill="#ffffff" stroke="url(#acc)" stroke-width="2.4"/>
    <path d="M18 52 L18 16 L23 16 L41 42 L41 16 L46 16 L46 52 L41 52 L23 26 L23 52 Z" fill="url(#acc)"/>
  </g>
  <text x="170" y="118" class="jp">设计未来</text>

  <!-- identity -->
  <text x="92" y="232" class="name">St0lym</text>
  <text x="98" y="276" class="sub">Jacques Marques <tspan class="accent">/ Node</tspan></text>

  <text x="98" y="330" class="role">AI Systems Architect</text>
  <text x="98" y="360" class="role">Researcher</text>
  <text x="98" y="390" class="role">Founder of <tspan fill="#1f6feb">Stakon</tspan></text>

  <line x1="100" y1="416" x2="148" y2="416" stroke="#1f6feb" stroke-width="3"/>
  <text x="98" y="456" class="tag">Designing systems that create <tspan fill="#1f6feb" font-style="italic">impact</tspan>.</text>
</svg>
