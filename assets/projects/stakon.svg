<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Stakon — holding and operating ecosystem for AI-native ventures">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="st-ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <style>
      .ttl{font:800 30px -apple-system,Segoe UI,Inter,sans-serif;fill:#0d1b2e}
      .dsc{font:500 16px -apple-system,Segoe UI,sans-serif;fill:#46566b}
      .chip{fill:#eaf2ff} .chipT{font:600 12px -apple-system,Segoe UI,sans-serif;fill:#1f6feb}
      .kind{font:600 11px -apple-system,Segoe UI,sans-serif;fill:#7c8aa0;letter-spacing:.14em}
    </style>
  </defs>
  <rect x="1" y="1" width="558" height="298" rx="18" fill="url(#st-bg)" stroke="#d6e4fb" stroke-width="1.4"/>

  <!-- motif: ecosystem orbit -->
  <g opacity="0.5" stroke="#bcd6ff" fill="none">
    <circle cx="452" cy="92" r="70"/><circle cx="452" cy="92" r="44" stroke-dasharray="2 6"/>
  </g>
  <g fill="#1f6feb"><circle cx="452" cy="22" r="4"/><circle cx="514" cy="120" r="4"/><circle cx="392" cy="124" r="4"/></g>

  <g transform="translate(34,30)">
    <path d="M26 0 L52 15 L52 45 L26 60 L0 45 L0 15 Z" fill="#fff" stroke="url(#st-ac)" stroke-width="2.4"/>
    <circle cx="26" cy="30" r="6" fill="url(#st-ac)"/>
    <g stroke="url(#st-ac)" stroke-width="2"><line x1="26" y1="30" x2="26" y2="8"/><line x1="26" y1="30" x2="45" y2="41"/><line x1="26" y1="30" x2="7" y2="41"/></g>
    <circle cx="26" cy="8" r="3" fill="#38bdf8"/><circle cx="45" cy="41" r="3" fill="#38bdf8"/><circle cx="7" cy="41" r="3" fill="#38bdf8"/>
  </g>

  <text x="34" y="146" class="kind">HOLDING · ECOSYSTEM</text>
  <text x="34" y="184" class="ttl">Stakon</text>
  <text x="34" y="218" class="dsc">Holding and operating ecosystem</text>
  <text x="34" y="240" class="dsc">for AI-native ventures.</text>

  <g>
    <rect class="chip" x="34"  y="258" width="96"  height="26" rx="13"/><text x="82"  y="275" text-anchor="middle" class="chipT">TypeScript</text>
    <rect class="chip" x="138" y="258" width="78"  height="26" rx="13"/><text x="177" y="275" text-anchor="middle" class="chipT">Next.js</text>
    <rect class="chip" x="224" y="258" width="96"  height="26" rx="13"/><text x="272" y="275" text-anchor="middle" class="chipT">Monorepo</text>
  </g>
</svg>
