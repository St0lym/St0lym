<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Workflow: Discover, Design, Build, Test, Deploy">
  <defs>
    <linearGradient id="wf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe3ff"/><stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <style>
      .num{font:700 12px -apple-system,Segoe UI,sans-serif;fill:#1f6feb;letter-spacing:.08em}
      .ttl{font:600 15px -apple-system,Segoe UI,Inter,sans-serif;fill:#1f2733}
      .sub{font:500 11px -apple-system,Segoe UI,sans-serif;fill:#8b97a8}
      .node{fill:#ffffff;stroke:#1f6feb;stroke-width:1.6}
    </style>
  </defs>

  <line x1="90" y1="55" x2="810" y2="55" stroke="url(#wf-line)" stroke-width="2"/>

  <!-- 5 steps centered at x = 90,270,450,630,810 -->
  <g>
    <circle class="node" cx="90"  cy="55" r="16"/><circle cx="90"  cy="55" r="5" fill="#1f6feb"/>
    <text x="90"  y="92"  text-anchor="middle" class="num">01</text>
    <text x="90"  y="110" text-anchor="middle" class="ttl">Discover</text>
    <text x="90"  y="128" text-anchor="middle" class="sub">Research &amp; Insight</text>
  </g>
  <g>
    <circle class="node" cx="270" cy="55" r="16"/><circle cx="270" cy="55" r="5" fill="#1f6feb"/>
    <text x="270" y="92"  text-anchor="middle" class="num">02</text>
    <text x="270" y="110" text-anchor="middle" class="ttl">Design</text>
    <text x="270" y="128" text-anchor="middle" class="sub">Strategy &amp; Architecture</text>
  </g>
  <g>
    <circle class="node" cx="450" cy="55" r="16"/><circle cx="450" cy="55" r="5" fill="#1f6feb"/>
    <text x="450" y="92"  text-anchor="middle" class="num">03</text>
    <text x="450" y="110" text-anchor="middle" class="ttl">Build</text>
    <text x="450" y="128" text-anchor="middle" class="sub">Code &amp; Prototype</text>
  </g>
  <g>
    <circle class="node" cx="630" cy="55" r="16"/><circle cx="630" cy="55" r="5" fill="#1f6feb"/>
    <text x="630" y="92"  text-anchor="middle" class="num">04</text>
    <text x="630" y="110" text-anchor="middle" class="ttl">Test</text>
    <text x="630" y="128" text-anchor="middle" class="sub">Validate &amp; Iterate</text>
  </g>
  <g>
    <circle class="node" cx="810" cy="55" r="16"/><circle cx="810" cy="55" r="5" fill="#1f6feb"/>
    <text x="810" y="92"  text-anchor="middle" class="num">05</text>
    <text x="810" y="110" text-anchor="middle" class="ttl">Deploy</text>
    <text x="810" y="128" text-anchor="middle" class="sub">Ship &amp; Monitor</text>
  </g>
</svg>
