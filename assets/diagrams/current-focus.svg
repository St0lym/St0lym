<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Current research focus areas">
  <defs>
    <style>
      .cap{font:600 11px -apple-system,Segoe UI,sans-serif;fill:#1f6feb;letter-spacing:.12em}
      .pill{fill:#f4f9ff;stroke:#cfe3ff;stroke-width:1.3}
      .pillA{fill:#eaf2ff;stroke:#1f6feb;stroke-width:1.4}
      .pt{font:600 13px -apple-system,Segoe UI,Inter,sans-serif;fill:#2a3645}
      .pta{font:600 13px -apple-system,Segoe UI,Inter,sans-serif;fill:#1f6feb}
      .line{stroke:#dbe7fb;stroke-width:1.2}
      .core{fill:#1f6feb}
    </style>
  </defs>
  <text x="32" y="30" class="cap">CURRENT FOCUS · RESEARCH</text>

  <!-- connective tissue -->
  <g class="line">
    <line x1="380" y1="160" x2="170" y2="80"/>
    <line x1="380" y1="160" x2="560" y2="78"/>
    <line x1="380" y1="160" x2="150" y2="170"/>
    <line x1="380" y1="160" x2="600" y2="168"/>
    <line x1="380" y1="160" x2="250" y2="250"/>
    <line x1="380" y1="160" x2="520" y2="252"/>
  </g>
  <circle class="core" cx="380" cy="160" r="6"/>
  <circle cx="380" cy="160" r="13" fill="none" stroke="#1f6feb" stroke-width="1.4" opacity="0.5"/>

  <!-- pills -->
  <g>
    <rect class="pillA" x="46"  y="62"  width="248" height="36" rx="18"/>
    <text x="170" y="85"  text-anchor="middle" class="pta">Autonomous agent orchestration</text>
  </g>
  <g>
    <rect class="pill" x="430" y="60"  width="266" height="36" rx="18"/>
    <text x="563" y="83"  text-anchor="middle" class="pt">Frontier small language models</text>
  </g>
  <g>
    <rect class="pill" x="20"  y="152" width="262" height="36" rx="18"/>
    <text x="151" y="175" text-anchor="middle" class="pt">Representation learning &amp; embeddings</text>
  </g>
  <g>
    <rect class="pill" x="472" y="150" width="264" height="36" rx="18"/>
    <text x="604" y="173" text-anchor="middle" class="pt">Hypercomplex neural architectures</text>
  </g>
  <g>
    <rect class="pill" x="118" y="232" width="262" height="36" rx="18"/>
    <text x="249" y="255" text-anchor="middle" class="pt">AI-native company infrastructure</text>
  </g>
  <g>
    <rect class="pillA" x="392" y="234" width="280" height="36" rx="18"/>
    <text x="532" y="257" text-anchor="middle" class="pta">Retrieval, memory &amp; code intelligence</text>
  </g>
</svg>
