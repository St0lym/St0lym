name: Update profile metrics

# Keeps assets/generated/*.svg in sync with REAL GitHub data.
# Runs on a schedule, on push to main, and on demand.

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/generate-profile.mjs"
      - ".github/workflows/update-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate metric snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/generate-profile.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "No metric changes."
          else
            git commit -m "chore(profile): refresh GitHub metric snapshots"
            git push
          fi
